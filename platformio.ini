; Elecrow CrowPanel ESP32 E-Paper HMI 4.2" (SKU DIE07300S)
; See docs/HARDWARE.md for the reasoning behind every override below.

[platformio]
default_envs  = epaper42
extra_configs = secrets.ini       ; gitignored; copy secrets.ini.example

; ---------------------------------------------------------------------------
; Firmware for the board itself.
; ---------------------------------------------------------------------------
[env:epaper42]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino

; No upstream PlatformIO board for this panel. esp32-s3-devkitc-1 with explicit
; overrides, chosen by memory geometry rather than name: the module is an
; ESP32-S3-WROOM-1-N8R8 = 8 MB QUAD flash + 8 MB OCTAL PSRAM (embedded in the
; ESP32-S3R8 die; esptool reports "Embedded PSRAM 8MB (AP_3v3)"). One
; third-party page says quad PSRAM; that is wrong for an R8 part.
board = esp32-s3-devkitc-1

board_build.arduino.memory_type = qio_opi      ; quad flash, OCTAL psram
board_build.psram_type          = opi
board_build.flash_mode          = qio
board_upload.flash_size         = 8MB
; Two OTA app slots of 0x330000 each, bundled with the core. The factory
; firmware already used this exact table.
board_build.partitions          = default_8MB.csv
board_upload.maximum_size       = 3342336      ; one slot, so the size check is honest

; Bump this to release a new version. It is the only place the version lives.
custom_fw_version = 1.0.0

build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    ; No native USB on the USB-C port: it goes to a CH340C on GPIO43/44, and
    ; GPIO19/20 reach only the 2x10 header. CDC-on-boot would send Serial to
    ; a peripheral nobody is listening to.
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=0
    ; Both panel drivers are compiled in and chosen at boot (src/ui.cpp); this
    ; gives them a common virtual base class. Add -DEPD_PANEL_SSD1683 or
    ; -DEPD_PANEL_UC8276 to skip the BUSY probe and force one.
    -DENABLE_GxEPD2_GFX=1
    ;
    ; Secrets come from the gitignored secrets.ini. Its values carry their own
    ; double quotes (PlatformIO keeps them), so they get only the shell's single
    ; quotes; mqtt_port is a bare number. custom_fw_version is bare, so it gets
    ; both quote levels.
    -DFW_VERSION='"${this.custom_fw_version}"'
    -DWIFI_SSID='${secrets.wifi_ssid}'
    -DWIFI_PASSWORD='${secrets.wifi_pass}'
    -DMQTT_HOST='${secrets.mqtt_host}'
    -DMQTT_PORT=${secrets.mqtt_port}
    -DMQTT_TOPIC_TEMP='${secrets.mqtt_topic_temp}'
    -DMQTT_TOPIC_HUM='${secrets.mqtt_topic_hum}'
    -DINDOOR_LABEL='${secrets.indoor_label}'
    -DOUTDOOR_LABEL='${secrets.outdoor_label}'
    -DWEATHER_LATITUDE='${secrets.weather_latitude}'
    -DWEATHER_LONGITUDE='${secrets.weather_longitude}'
    -DOTA_HOSTNAME='${secrets.device_host}'
    -DOTA_PASSWORD='${secrets.ota_password}'

lib_deps =
    zinggjm/GxEPD2 @ ^1.6.9
    olikraus/U8g2_for_Adafruit_GFX @ ^1.8.0
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0.0
    ; Private library: fetched over SSH, so the build needs read access to it.
    esp32-ota-kit=git+ssh://git@github.com/robominds/esp32-ota-kit.git#v1.0.0

; Reading flash back failed at 921600 and 460800 on this unit, and the
; community fixes for this board all upload slower. The UART passes through
; 2N7002 level shifters with 5.6 k pull-ups, which round off fast edges.
upload_speed    = 230400
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time

; ---------------------------------------------------------------------------
; Same firmware, uploaded over WiFi to a panel already running it.
;   pio run -e epaper42_ota -t upload
; ---------------------------------------------------------------------------
[env:epaper42_ota]
extends         = env:epaper42
upload_protocol = espota
upload_port     = ${secrets.device_host}.local
upload_flags    = --auth=${secrets.ota_password}

; ---------------------------------------------------------------------------
; Host tests. Builds ONLY the pure libraries - no Arduino, no hardware.
; ---------------------------------------------------------------------------
[env:native]
platform = native
build_flags = -std=c++17 -Wall -Wextra
build_src_filter = -<*>
lib_compat_mode = off
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
